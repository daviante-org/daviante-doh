name: Continuous Integration - daviante-doh

on:
  push:
    branches: ["main", "master", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-sonar:
    name: Rust Quality, Coverage & SonarQube Gate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history required for accurate SonarQube blame & new-code analysis

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Verify pure library crate tree
        run: |
          if cargo tree --no-default-features --features tls | grep -E "clap|mimalloc|dnsstamps"; then
            echo "ERROR: CLI-only dependencies leaked into daviante-doh library crate"
            exit 1
          fi

      - name: Run unit & integration tests with LLVM coverage (all features)
        run: |
          RUSTFLAGS="-C instrument-coverage" cargo test --test integration --all-features --locked --no-run
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's|host: ||p')/bin"
          rm -f lcov.info cov-*.profraw cov.profdata
          for bin in $(find target/debug/deps -maxdepth 1 -type f -executable -name "integration-*" ! -name "*.so" ! -name "*.d"); do
            LLVM_PROFILE_FILE="cov-%p.profraw" "$bin"
            "$LLVM_BIN/llvm-profdata" merge -sparse cov-*.profraw -o "cov.profdata"
            "$LLVM_BIN/llvm-cov" export --format=lcov --instr-profile="cov.profdata" --ignore-filename-regex="(/cargo/registry/|/rustup/|/rustc/|/tests/|src/main\.rs)" -object "$bin" | sed "s|^SF:$(pwd)/|SF:|g" > lcov.info
          done
          test -s lcov.info

      - name: Run unit & integration tests (no default features)
        run: cargo test --test integration --no-default-features --locked

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Ensure SonarCloud CI-based Analysis is active (disable AutoScan)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            curl --proto '=https' --tlsv1.2 -sS -X POST \
              -u "${SONAR_TOKEN}:" \
              --data-binary "enable=false&projectKey=daviante-org_daviante-doh" \
              "https://sonarcloud.io/api/autoscan/activation" >/dev/null || true
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  supply-chain-audit:
    name: Supply Chain & Vulnerability Audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  container-e2e-and-blackbox:
    name: Container, Kubernetes (MetalLB LB) & OpenShift (HAProxy Router) Black-Box Matrix
    needs: [quality-and-sonar, supply-chain-audit]
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Unified Helm Chart (Kubernetes & OpenShift modes)
        run: |
          helm lint ./charts/daviante-doh --strict
          helm lint ./charts/daviante-doh --strict --set tls.enabled=true --set tls.secretName=daviante-doh-tls --set route.enabled=true --set route.host=doh.daviante.org --set policy.blocklist[0]=ads.example.com --set networkPolicy.enabled=true --set serviceMonitor.enabled=true --set config.adminListenAddress=0.0.0.0:9090
          helm lint ./charts/daviante-doh --strict --set service.type=LoadBalancer --set ingress.enabled=true --set tls.enabled=true --set tls.secretName=daviante-doh-tls
          helm template daviante-doh ./charts/daviante-doh --set route.enabled=true --set route.host=doh.example.com > /dev/null
          helm template daviante-doh ./charts/daviante-doh --set ingress.enabled=true > /dev/null

      - name: Build Production Container Image (Single Build)
        run: |
          docker build \
            --build-arg BUILD_TLS=true \
            --build-arg RUN_TESTS=false \
            -t ghcr.io/daviante-org/daviante-doh:e2e-test \
            -f Dockerfile .

      - name: Run Container E2E & OpenShift restricted-v2 Smoke Suite
        env:
          SKIP_BUILD: "true"
          IMAGE_TAG: "ghcr.io/daviante-org/daviante-doh:e2e-test"
        run: sh ./scripts/e2e/test-container.sh

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.0"
          image-ref: "ghcr.io/daviante-org/daviante-doh:e2e-test"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Run Standalone Container Black-Box API & Protocol Suite (73 Cases)
        env:
          SKIP_BUILD: "true"
          IMAGE_TAG: "ghcr.io/daviante-org/daviante-doh:e2e-test"
          DOH_EVIDENCE_DIR: "./test-evidence/container"
          DOH_ENV_NAME: "Standalone Container (Docker/Podman)"
          DOH_LOAD_BALANCER_MODE: "Direct Container Port-Map (127.0.0.1:8443 -> 8443/tcp)"
          DOH_SECURITY_CONTEXT: "Container Non-Root (UID 10001:0, cap-drop=ALL)"
          DOH_REPLICA_COUNT: "1"
        run: sh ./scripts/e2e/run-blackbox-ci.sh

      - name: Run Kubernetes (MetalLB LB + Ingress) & OpenShift (Route CRD + HAProxy Router) Black-Box Matrix (146 Cases)
        env:
          IMAGE_TAG: "ghcr.io/daviante-org/daviante-doh:e2e-test"
        run: sh ./scripts/e2e/run-k8s-openshift-blackbox.sh

      - name: Aggregate 3-Environment Comparison Matrix & Publish to GitHub Step Summary
        if: always()
        run: |
          node ./scripts/e2e/aggregate-multi-env.mjs
          if [ -f ./test-evidence/multi-env-matrix.md ]; then
            cat ./test-evidence/multi-env-matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Multi-environment test evidence file was not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print Structured Multi-Environment JSON Metrics Summary
        if: always()
        run: |
          if [ -f ./test-evidence/multi-env-metrics.json ]; then
            node -e '
              const fs = require("fs");
              const m = JSON.parse(fs.readFileSync("./test-evidence/multi-env-metrics.json", "utf8"));
              console.log("=== Multi-Environment Telemetry Summary ===");
              console.log(JSON.stringify({
                generatedAt: m.generatedAt,
                summary: m.summary,
                environmentMatrix: m.environmentMatrix,
                categoryComparisonMatrix: m.categoryComparisonMatrix
              }, null, 2));
            '
          fi

      - name: Upload Multi-Environment Black-Box Evidence & Metrics Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackbox-api-metrics-${{ github.run_number }}
          path: |
            test-evidence/multi-env-matrix.md
            test-evidence/multi-env-metrics.json
            test-evidence/live-api-results.md
            test-evidence/container/**
            test-evidence/kubernetes/**
            test-evidence/openshift/**
          if-no-files-found: error
          retention-days: 90