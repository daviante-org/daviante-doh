<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="235" height="56" role="img" aria-label="Daviante DoH — Enterprise DNS and Protective Policy Engine">
  <defs>
    <linearGradient id="badgeBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="brandGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>
    <filter id="neonGlowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Badge (Dark Mode Obsidian Surface) -->
  <g>
    <rect x="4" y="4" width="192" height="192" rx="42" fill="url(#badgeBgDark)" stroke="#30363d" stroke-width="3.5" />
    <rect x="14" y="14" width="172" height="172" rx="34" fill="none" stroke="#21262d" stroke-width="1.5" />

    <!-- Decorative Orbit Rings -->
    <g opacity="0.32" transform="translate(100, 100) scale(0.86)">
      <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#bc8cff" stroke-width="2.2" transform="rotate(15)" />
      <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#58a6ff" stroke-width="2.2" transform="rotate(-15)" />
    </g>

    <!-- Abstract "D" Emblem with Neon Glow -->
    <g transform="translate(100, 100) scale(1.52)" filter="url(#neonGlowDark)">
      <path d="M-25,-30 L5,-30 Q35,-30 35,0 Q35,30 5,30 L-25,30 Z" fill="none" stroke="url(#brandGradDark)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-10" cy="0" r="5.2" fill="#58a6ff" />
      <line x1="-10" y1="5" x2="-10" y2="30" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Primary Wordmark: DAVIANTE (x = 224..600) -->
  <text
    x="224"
    y="104"
    textLength="376"
    lengthAdjust="spacing"
    fill="#f0f6fc"
    font-family="RedHatDisplay, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="64"
    font-weight="800"
  >DAVIANTE</text>

  <!-- Generous 56-unit visual separation (x = 600..656) before DoH Pill Badge (x = 656..824) -->
  <rect
    x="656"
    y="46"
    width="168"
    height="72"
    rx="18"
    fill="#161b22"
    stroke="url(#brandGradDark)"
    stroke-width="3.5"
  />
  <text
    x="740"
    y="98"
    text-anchor="middle"
    fill="url(#brandGradDark)"
    font-family="RedHatDisplay, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="2"
  >DoH</text>

  <!-- Subtitle Strapline (x = 226..822) -->
  <text
    x="226"
    y="162"
    textLength="596"
    lengthAdjust="spacing"
    fill="#9ca3af"
    font-family="RedHatText, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="22"
    font-weight="700"
  >DNS &amp; PROTECTIVE POLICY ENGINE</text>
</svg>
