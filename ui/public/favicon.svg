<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" />
  
  <!-- Decorative Orbit Rings -->
  <g opacity="0.25" transform="translate(100, 100) scale(0.9)">
    <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#bc8cff" stroke-width="2" transform="rotate(15)" />
    <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#58a6ff" stroke-width="2" transform="rotate(-15)" />
  </g>

  <!-- Abstract "D" Logo Graphic with Glow -->
  <g transform="translate(100, 100) scale(1.6)" filter="url(#neonGlow)">
    <path d="M-25,-30 L5,-30 Q35,-30 35,0 Q35,30 5,30 L-25,30 Z" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-10" cy="0" r="5" fill="#58a6ff" />
    <line x1="-10" y1="5" x2="-10" y2="30" stroke="#58a6ff" stroke-width="2.8" stroke-linecap="round" />
  </g>
</svg>
