<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="235" height="56" role="img" aria-label="Daviante DoH — Enterprise DNS and Protective Policy Engine">
  <defs>
    <linearGradient id="badgeBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="brandGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Left Icon Badge (Light Mode Surface) -->
  <g>
    <rect x="4" y="4" width="192" height="192" rx="42" fill="url(#badgeBgLight)" stroke="#cbd5e1" stroke-width="3.5" />
    <rect x="14" y="14" width="172" height="172" rx="34" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Decorative Orbit Rings -->
    <g opacity="0.34" transform="translate(100, 100) scale(0.86)">
      <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#7c3aed" stroke-width="2.4" transform="rotate(15)" />
      <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#0284c7" stroke-width="2.4" transform="rotate(-15)" />
    </g>

    <!-- Abstract "D" Emblem -->
    <g transform="translate(100, 100) scale(1.52)" filter="url(#softGlowLight)">
      <path d="M-25,-30 L5,-30 Q35,-30 35,0 Q35,30 5,30 L-25,30 Z" fill="none" stroke="url(#brandGradLight)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-10" cy="0" r="5.2" fill="#0284c7" />
      <line x1="-10" y1="5" x2="-10" y2="30" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Primary Wordmark: DAVIANTE (x = 224..600) -->
  <text
    x="224"
    y="104"
    textLength="376"
    lengthAdjust="spacing"
    fill="#0f172a"
    font-family="RedHatDisplay, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="64"
    font-weight="800"
  >DAVIANTE</text>

  <!-- Generous 56-unit visual separation (x = 600..656) before DoH Pill Badge (x = 656..824) -->
  <rect
    x="656"
    y="46"
    width="168"
    height="72"
    rx="18"
    fill="#f5f3ff"
    stroke="url(#brandGradLight)"
    stroke-width="3.5"
  />
  <text
    x="740"
    y="98"
    text-anchor="middle"
    fill="url(#brandGradLight)"
    font-family="RedHatDisplay, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="2"
  >DoH</text>

  <!-- Subtitle Strapline (x = 226..822) -->
  <text
    x="226"
    y="162"
    textLength="596"
    lengthAdjust="spacing"
    fill="#475569"
    font-family="RedHatText, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="22"
    font-weight="700"
  >DNS &amp; PROTECTIVE POLICY ENGINE</text>
</svg>
