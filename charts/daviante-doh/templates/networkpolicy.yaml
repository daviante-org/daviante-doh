{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "daviante-doh.fullname" . }}
  labels:
    {{- include "daviante-doh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "daviante-doh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ include "daviante-doh.containerPort" . | int }}
        {{- if ne .Values.config.adminListenAddress "" }}
        - protocol: TCP
          port: {{ include "daviante-doh.adminPort" . | int }}
        {{- end }}
      {{- with .Values.networkPolicy.allowIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 853
      to:
        {{- range (splitList "," .Values.config.serverAddress) }}
        {{- $addr := trim . -}}
        {{- $ip := first (splitList ":" $addr) -}}
        {{- if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $ip }}
        - ipBlock:
            cidr: {{ printf "%s/32" $ip }}
        {{- end }}
        {{- end }}
    {{- with .Values.networkPolicy.extraEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
