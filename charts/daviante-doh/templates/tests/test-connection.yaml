apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "daviante-doh.fullname" . }}-test-connection"
  labels:
    {{- include "daviante-doh.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "daviante-doh.serviceAccountName" . }}
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: daviante-doh-healthcheck
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      command: ["/usr/local/bin/daviante-doh", "--healthcheck"]
      env:
        - name: DOH_LISTEN_ADDRESS
          value: "{{ include "daviante-doh.fullname" . }}:{{ .Values.service.port }}"
        - name: DOH_HEALTH_PATH
          value: "/readyz"
        {{- if .Values.tls.enabled }}
        - name: DOH_TLS_CERT_PATH
          value: "/etc/daviante-doh/certs/tls.crt"
        {{- end }}
      {{- if .Values.tls.enabled }}
      volumeMounts:
        - name: tls-certs
          mountPath: /etc/daviante-doh/certs
          readOnly: true
      {{- end }}
  {{- if .Values.tls.enabled }}
  volumes:
    - name: tls-certs
      secret:
        secretName: {{ .Values.tls.secretName }}
  {{- end }}
  restartPolicy: Never
