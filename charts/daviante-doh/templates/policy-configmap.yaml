{{- if and (eq .Values.policy.existingConfigMap "") (or (gt (len .Values.policy.allowlist) 0) (gt (len .Values.policy.blocklist) 0) (gt (len .Values.policy.hosts) 0)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "daviante-doh.fullname" . }}-policy
  labels:
    {{- include "daviante-doh.labels" . | nindent 4 }}
data:
  allowlist.txt: |
    {{- range .Values.policy.allowlist }}
    {{ . }}
    {{- end }}
  blocklist.txt: |
    {{- range .Values.policy.blocklist }}
    {{ . }}
    {{- end }}
  hosts.txt: |
    {{- range .Values.policy.hosts }}
    {{ . }}
    {{- end }}
{{- end }}
