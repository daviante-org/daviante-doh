services:
  daviante-doh:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TLS: "true"
        RUN_TESTS: "true"
    image: ghcr.io/daviante-org/daviante-doh:latest
    container_name: daviante-doh
    restart: unless-stopped
    ports:
      - "${DOH_HOST_PORT:-3000}:3000"
    environment:
      DOH_LISTEN_ADDRESS: "${DOH_LISTEN_ADDRESS:-0.0.0.0:3000}"
      DOH_ADMIN_LISTEN_ADDRESS: "${DOH_ADMIN_LISTEN_ADDRESS:-}"
      DOH_SERVER_ADDRESS: "${DOH_SERVER_ADDRESS:-9.9.9.9:53}"
      DOH_UPSTREAM_STRATEGY: "${DOH_UPSTREAM_STRATEGY:-failover}"
      DOH_UPSTREAM_DOT_SNI: "${DOH_UPSTREAM_DOT_SNI:-}"
      DOH_LOCAL_BIND_ADDRESS: "${DOH_LOCAL_BIND_ADDRESS:-}"
      DOH_HOSTNAME: "${DOH_HOSTNAME:-}"
      DOH_PUBLIC_ADDRESS: "${DOH_PUBLIC_ADDRESS:-}"
      DOH_PUBLIC_PORT: "${DOH_PUBLIC_PORT:-}"
      DOH_PATH: "${DOH_PATH:-/dns-query}"
      DOH_ODOH_CONFIGS_PATH: "${DOH_ODOH_CONFIGS_PATH:-/.well-known/odohconfigs}"
      DOH_HEALTH_PATH: "${DOH_HEALTH_PATH:-/healthz}"
      DOH_ENABLE_METRICS: "${DOH_ENABLE_METRICS:-false}"
      DOH_METRICS_PATH: "${DOH_METRICS_PATH:-/metrics}"
      DOH_MAX_CLIENTS: "${DOH_MAX_CLIENTS:-512}"
      DOH_MAX_CONCURRENT: "${DOH_MAX_CONCURRENT:-16}"
      DOH_MAX_CONNS_PER_IP: "${DOH_MAX_CONNS_PER_IP:-0}"
      DOH_TIMEOUT: "${DOH_TIMEOUT:-10}"
      DOH_SHUTDOWN_GRACE_SECS: "${DOH_SHUTDOWN_GRACE_SECS:-25}"
      DOH_MIN_TTL: "${DOH_MIN_TTL:-0}"
      DOH_MAX_TTL: "${DOH_MAX_TTL:-604800}"
      DOH_ERR_TTL: "${DOH_ERR_TTL:-2}"
      DOH_STALE_IF_ERROR: "${DOH_STALE_IF_ERROR:-86400}"
      DOH_STALE_WHILE_REVALIDATE: "${DOH_STALE_WHILE_REVALIDATE:-60}"
      DOH_CACHE_SIZE: "${DOH_CACHE_SIZE:-0}"
      DOH_SERVE_STALE_TTL: "${DOH_SERVE_STALE_TTL:-0}"
      DOH_CACHE_PREFETCH: "${DOH_CACHE_PREFETCH:-false}"
      DOH_DISABLE_COALESCING: "${DOH_DISABLE_COALESCING:-false}"
      DOH_DISABLE_KEEPALIVE: "${DOH_DISABLE_KEEPALIVE:-false}"
      DOH_DISABLE_POST: "${DOH_DISABLE_POST:-false}"
      DOH_ALLOW_ODOH_POST: "${DOH_ALLOW_ODOH_POST:-false}"
      DOH_DISABLE_ANY: "${DOH_DISABLE_ANY:-false}"
      DOH_ENABLE_ECS: "${DOH_ENABLE_ECS:-false}"
      DOH_TRUSTED_PROXIES: "${DOH_TRUSTED_PROXIES:-}"
      DOH_ECS_PREFIX_V4: "${DOH_ECS_PREFIX_V4:-24}"
      DOH_ECS_PREFIX_V6: "${DOH_ECS_PREFIX_V6:-56}"
      DOH_ODOH_ROTATION_SECS: "${DOH_ODOH_ROTATION_SECS:-86400}"
      DOH_ALLOWLIST_FILE: "${DOH_ALLOWLIST_FILE:-}"
      DOH_BLOCKLIST_FILE: "${DOH_BLOCKLIST_FILE:-}"
      DOH_HOSTS_FILE: "${DOH_HOSTS_FILE:-}"
      DOH_BLOCK_ACTION: "${DOH_BLOCK_ACTION:-nxdomain}"
      DOH_BLOCK_PRIVATE_REBINDING: "${DOH_BLOCK_PRIVATE_REBINDING:-false}"
      DOH_RATE_LIMIT_RPS: "${DOH_RATE_LIMIT_RPS:-0}"
      DOH_RATE_LIMIT_BURST: "${DOH_RATE_LIMIT_BURST:-20}"
      DOH_RATE_LIMIT_V6_PREFIX: "${DOH_RATE_LIMIT_V6_PREFIX:-64}"
      DOH_CORS_ALLOW_ORIGIN: "${DOH_CORS_ALLOW_ORIGIN:-*}"
      DOH_LOG_QUERIES: "${DOH_LOG_QUERIES:-false}"
      DOH_LOG_CLIENT_IP: "${DOH_LOG_CLIENT_IP:-false}"
      DOH_LOG_FORMAT: "${DOH_LOG_FORMAT:-json}"
      DOH_LOG_LEVEL: "${DOH_LOG_LEVEL:-info}"
      DOH_TLS_CERT_PATH: "${DOH_TLS_CERT_PATH:-}"
      DOH_TLS_CERT_KEY_PATH: "${DOH_TLS_CERT_KEY_PATH:-}"
      DOH_TLS_MIN_VERSION: "${DOH_TLS_MIN_VERSION:-1.2}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/daviante-doh", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
